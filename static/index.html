<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LocalMind</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #f5f5f5;
         display: flex; flex-direction: column; height: 100vh; }
  header { background: white; border-bottom: 1px solid #e5e5e5;
           padding: 16px 24px; display: flex; align-items: center;
           justify-content: space-between; }
  header h1 { font-size: 17px; font-weight: 600; }
  #status { font-size: 12px; color: #888; }
  #messages { flex: 1; overflow-y: auto; padding: 24px;
              display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 720px; width: 100%; margin: 0 auto; }
  .msg.user { text-align: right; }
  .bubble { display: inline-block; padding: 12px 16px;
            border-radius: 16px; font-size: 15px; line-height: 1.5;
            max-width: 85%; text-align: left; white-space: pre-wrap; }
  .user .bubble { background: #0071e3; color: white;
                  border-bottom-right-radius: 4px; }
  .assistant .bubble { background: white; border: 1px solid #e5e5e5;
                        border-bottom-left-radius: 4px; }
  .sources { font-size: 11px; color: #999; margin-top: 6px;
             padding-left: 4px; }
  .sources span { background: #f0f0f0; border-radius: 4px;
                  padding: 2px 6px; margin-right: 4px; }
  #input-area { background: white; border-top: 1px solid #e5e5e5;
                padding: 16px 24px; }
  #input-row { max-width: 720px; margin: 0 auto;
               display: flex; gap: 10px; align-items: flex-end; }
  textarea { flex: 1; border: 1px solid #e5e5e5; border-radius: 12px;
             padding: 12px 16px; font-size: 15px; resize: none;
             font-family: inherit; outline: none; max-height: 120px; }
  textarea:focus { border-color: #0071e3; }
  button { background: #0071e3; color: white; border: none;
           border-radius: 10px; padding: 12px 20px; font-size: 15px;
           cursor: pointer; white-space: nowrap; }
  button:disabled { background: #ccc; cursor: default; }
  .typing { color: #999; font-style: italic; font-size: 14px; }
</style>
</head>
<body>

<header>
  <h1>LocalMind</h1>
  <span id="status">Loading...</span>
</header>

<div id="messages">
  <div class="msg assistant">
    <div class="bubble">Hi! Ask me anything. Drop documents into the <code>docs/</code> folder to build your knowledge base.</div>
  </div>
</div>

<div id="input-area">
  <div id="input-row">
    <textarea id="input" rows="1" placeholder="Ask a question..."></textarea>
    <button id="send-btn" onclick="sendMessage()">Send</button>
  </div>
</div>

<script>
  const history = [];

  function escapeHtml(text) {
    return text.replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
    }[char]));
  }

  async function loadStatus() {
    const r = await fetch('/status');
    const d = await r.json();
    document.getElementById('status').textContent =
      `${d.chunks_indexed.toLocaleString()} chunks indexed`;
  }
  loadStatus();

  function addMessage(role, text, sources = []) {
    const msgs = document.getElementById('messages');
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    let html = `<div class="bubble">${escapeHtml(text)}</div>`;
    if (sources.length) {
      const chips = sources.map(s => {
        const name = s.split('/').pop();
        return `<span title="${escapeHtml(s)}">${escapeHtml(name)}</span>`;
      }).join('');
      html += `<div class="sources">Sources: ${chips}</div>`;
    }
    div.innerHTML = html;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  async function sendMessage() {
    const input = document.getElementById('input');
    const btn = document.getElementById('send-btn');
    const question = input.value.trim();
    if (!question) return;

    input.value = '';
    input.style.height = 'auto';
    btn.disabled = true;

    addMessage('user', question);
    history.push({ role: 'user', content: question });

    const msgs = document.getElementById('messages');
    const wrapper = document.createElement('div');
    wrapper.className = 'msg assistant';
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.innerHTML = '<span class="typing">Thinking...</span>';
    wrapper.appendChild(bubble);
    msgs.appendChild(wrapper);
    msgs.scrollTop = msgs.scrollHeight;

    let fullText = '';
    let sources = [];

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question, history })
      });

      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const parts = buf.split('\n\n');
        buf = parts.pop(); // hold incomplete chunk
        for (const part of parts) {
          if (!part.startsWith('data: ')) continue;
          const raw = part.slice(6).trim();
          if (raw === '[DONE]') break;
          const msg = JSON.parse(raw);
          if (msg.error) { bubble.textContent = `Error: ${msg.error}`; break; }
          if (msg.t !== undefined) {
            if (fullText === '') bubble.textContent = ''; // clear "Thinking..."
            fullText += msg.t;
            bubble.textContent = fullText;
            msgs.scrollTop = msgs.scrollHeight;
          }
          if (msg.s) sources = msg.s;
        }
      }

      if (sources.length) {
        const chips = sources.map(s =>
          `<span title="${escapeHtml(s)}">${escapeHtml(s.split('/').pop())}</span>`).join('');
        const srcDiv = document.createElement('div');
        srcDiv.className = 'sources';
        srcDiv.innerHTML = `Sources: ${chips}`;
        wrapper.appendChild(srcDiv);
      }

      history.push({ role: 'assistant', content: fullText });
      if (history.length > 20) history.splice(0, 2);

    } catch (e) {
      bubble.innerHTML = '<span style="color:red">Error — is the server running?</span>';
    }

    btn.disabled = false;
    msgs.scrollTop = msgs.scrollHeight;
  }

  // Send on Enter (Shift+Enter for newline)
  document.getElementById('input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
  });

  // Auto-resize textarea
  document.getElementById('input').addEventListener('input', function() {
    this.style.height = 'auto';
    this.style.height = Math.min(this.scrollHeight, 120) + 'px';
  });
</script>
</body>
</html>
